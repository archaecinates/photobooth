<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Pics</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Lora', serif;
      background-color: #fefaf5;
      text-align: center;
      padding: 50px 20px;
      color: #5b4636;
    }

    header {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 10;
    }

    .home-tag {
      text-decoration: none;
      color: #5a4637;
      font-size: 21px;
      font-weight: bold;
    }

    h1 {
      font-size: 32px;
      color: #5b4636;
    }

    .container-wrapper {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .upload-container {
      width: 180px;
      height: 180px;
      border: 1.5px solid #5b4636;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      border-radius: 10px;
      transition: 0.3s;
      overflow: hidden;
    }

    .upload-container:hover {
      background: #f0e6dd;
    }

    .upload-container img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-text {
      color: #5b4636;
      font-size: 14px;
      font-weight: bold;
      position: absolute;
      z-index: 1;
    }

    input[type="file"] {
      display: none;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    #doneButton,
    #backButton {
      padding: 10px 20px;
      border: 1.5px solid #5b4636;
      background: transparent;
      color: #5b4636;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.3s;
      font-family: 'Lora', serif;
    }

    #doneButton:hover {
      background: #5b4636;
      color: #f0e6dd;
    }

    #backButton {
      border-color: #c3a792;
      color: #866e5d;
    }

    #backButton:hover {
      background: #f0e6dd;
      border-color: #5b4636;
      color: #5b4636;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 16px 28px;
      }

      h1 {
        font-size: 22px;
        margin: 0;
      }

      .container-wrapper {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        max-width: 360px;
        margin: 20px auto 0;
      }

      .container-wrapper[data-count="3"] {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .upload-container {
        box-sizing: border-box;
        width: 100%;
        max-width: none;
        height: auto;
        aspect-ratio: 1 / 1;
      }

      .upload-text {
        font-size: 13px;
      }

      header {
        position: static;
        text-align: left;
        margin-bottom: 12px;
      }

      .home-tag {
        font-size: 18px;
      }

      .actions {
        max-width: 280px;
        margin: 24px auto 0;
      }

      .actions button {
        flex: 1;
        padding: 12px 16px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="home-tag">photobooth</a>
  </header>

  <h1>Choose Your Pics</h1>

  <div class="container-wrapper" id="uploadContainer"></div>

  <div class="actions">
    <button id="backButton" onclick="window.location.href = 'choosestyle.html'">
      Back
    </button>

    <button id="doneButton" onclick="finishSelection()">
      Done
    </button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      let photoCount = localStorage.getItem("photoCount") || 2;
      let container = document.getElementById("uploadContainer");

      container.setAttribute("data-count", photoCount);

      for (let i = 1; i <= photoCount; i++) {
        let uploadDiv = document.createElement("div");

        uploadDiv.classList.add("upload-container");
        uploadDiv.id = `uploadBox${i}`;

        uploadDiv.innerHTML = `
          <span class="upload-text">Upload ${i}</span>
          <input
            type="file"
            id="fileInput${i}"
            accept="image/*"
            onchange="previewImage(event, ${i})"
          >
          <img id="preview${i}" style="display: none;">
        `;

        uploadDiv.addEventListener("click", function () {
          document.getElementById(`fileInput${i}`).click();
        });

        container.appendChild(uploadDiv);
      }
    });

    function previewImage(event, index) {
      const file = event.target.files[0];

      if (file) {
        const reader = new FileReader();

        reader.onload = function (e) {
          let img = new Image();
          img.src = e.target.result;

          img.onload = function () {
            const MAX_WIDTH = 800;
            const scale = img.width > MAX_WIDTH
              ? MAX_WIDTH / img.width
              : 1;

            const newWidth = img.width * scale;
            const newHeight = img.height * scale;

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = newWidth;
            canvas.height = newHeight;

            ctx.drawImage(
              img,
              0,
              0,
              newWidth,
              newHeight
            );

            const compressedImage =
              canvas.toDataURL("image/jpeg", 0.85);

            document.getElementById(`preview${index}`).src =
              compressedImage;

            document.getElementById(`preview${index}`).style.display =
              "block";
          };
        };

        reader.readAsDataURL(file);
      }
    }

    function finishSelection() {
      const selectedImages = [];
      let photoCount = localStorage.getItem("photoCount") || 2;

      for (let i = 1; i <= photoCount; i++) {
        const img = document.getElementById(`preview${i}`);

        if (
          img &&
          img.src &&
          img.style.display !== "none"
        ) {
          selectedImages.push(img.src);
        }
      }

      if (selectedImages.length === 0) {
        alert("Please upload at least one image before proceeding!");
        return;
      }

      try {
        localStorage.setItem(
          "savedPhotos",
          JSON.stringify(selectedImages)
        );

        console.log(
          "Images saved to localStorage:",
          selectedImages
        );

        window.location.href = "choose.html";

      } catch (error) {
        console.error(
          "Error saving to localStorage:",
          error
        );

        alert(
          "Couldn't save your photos (storage is full). Try smaller photos."
        );
      }
    }
  </script>

</body>
</html>
