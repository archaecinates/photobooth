<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
  <title>Photo Customizer</title>

  <style>
    @font-face {
      font-family: 'Dancing Script';
      src: url('./fonts/dancing-script-v28-latin-regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: "Lora", serif;
      margin: 0;
      padding: 0 20px 48px;
      background: #fffaf7;
      color: #544235;
    }

    header {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 10;
    }

    .home-tag {
      text-decoration: none;
      color: #5a4637;
      font-size: 21px;
      font-weight: bold;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      padding-top: 72px;
    }

    h2 {
      color: #786252;
      text-align: center;
      margin: 0 0 32px;
    }

    .layout {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 56px;
    }

    .photo-strip {
      display: grid;
      gap: 8px;
      padding: 8px;
      width: 108px;
      justify-items: center;
      align-items: center;
      background-color: #fffdfc;
      box-shadow: 0 4px 12px rgba(120, 120, 120, 0.15);
    }

    .photo-strip[data-count="4"] {
      grid-template-columns: repeat(2, 1fr);
      width: 224px;
    }

    .photo-strip img {
      width: 108px;
      height: 108px;
      object-fit: cover;
    }

    .custom-text {
      grid-column: 1 / -1;
      width: 100%;
      text-align: center;
      font-size: 12px;
      margin-top: 6px;
      height: 20px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-family: 'Dancing Script', cursive;
      font-style: italic;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      max-width: 360px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field label {
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      height: 44px;
      padding: 8px 10px;
      font-size: 15px;
      border: 1.5px solid #a08572;
      border-radius: 5px;
      outline: none;
      transition: 0.3s;
      font-family: 'Dancing Script', cursive;
      font-style: italic;
      background: #fffdfc;
    }

    input[type="text"]:focus {
      border-color: #866e5d;
      box-shadow: 0 0 5px rgba(95, 77, 53, 0.8);
    }

    input[type="text"]::placeholder {
      color: gray;
    }

    .filter-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button {
      background-color: transparent;
      border: 1px solid #786252;
      color: #786252;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s ease;
      font-family: "Lora", serif;
    }

    .filter-button:hover {
      background-color: #544235;
      border-color: #544235;
      color: #fff;
    }

    .filter-button:active {
      transform: scale(0.95);
    }

    .filter-button.selected {
      background-color: #544235;
      border-color: #544235;
      color: #fff;
    }

    #previewButton {
      align-self: flex-start;
      padding: 10px 24px;
      font-size: 15px;
      border: none;
      background-color: #866e5d;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-family: "Lora", serif;
    }

    #previewButton:hover {
      background-color: #766253;
    }

    .empty-msg {
      text-align: center;
      color: #8a6f56;
    }

    @media screen and (max-width: 600px) {
      header {
        position: static;
        padding-top: 16px;
      }

      .page {
        padding-top: 12px;
      }

      .layout {
        gap: 32px;
      }

      .photo-strip {
        margin-left: 0;
        justify-content: center;
        max-width: 100%;
        justify-items: center;
      }

      .photo-strip[data-count="1"],
      .photo-strip[data-count="2"],
      .photo-strip[data-count="3"] {
        grid-template-columns: 1fr;
      }

      .photo-strip[data-count="4"] {
        grid-template-columns: repeat(2, 1fr);
      }

      .photo-strip img {
        max-width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
      }

      #previewButton {
        align-self: center;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="home-tag">photobooth</a>
  </header>

  <div class="page">
    <h2>Customize your photostrip</h2>

    <div class="layout">
      <div class="photo-strip" id="photoStrip"></div>
      <div class="controls">
        <div class="field">
          <label for="customTextInput">Custom Text</label>

          <input type="text" id="customTextInput" placeholder="type here..." value=""/>
        </div>

        <div class="field">
          <label>Filter</label>

          <div
            class="filter-options"
            id="filterOptions"
          ></div>
        </div>

        <button id="previewButton">
          preview
        </button>
      </div>
    </div>
  </div>

  <script src="templates.js"></script>
  <script>
    const FILTERS = [
      {
        name: "None",
        value: "none"
      },
      {
        name: "Grayscale",
        value: "grayscale(100%)"
      },
      {
        name: "Sepia",
        value: "sepia(90%)"
      },
      {
        name: "Dreamy Pastel",
        value: "brightness(120%) saturate(120%) blur(0.48px)"
      },
      {
        name: "Retro 90s",
        value: "sepia(40%) brightness(110%) contrast(80%) hue-rotate(15deg) saturate(140%) blur(0.3px)"
      },
      {
        name: "Vivid",
        value: "saturate(160%) contrast(110%)"
      },
      {
        name: "Noir",
        value: "grayscale(100%) contrast(140%) brightness(90%)"
      },
      {
        name: "Warm Glow",
        value: "sepia(25%) saturate(130%) brightness(108%) hue-rotate(-10deg)"
      },
      {
        name: "Cool Breeze",
        value: "sepia(30%) hue-rotate(170deg) saturate(110%) brightness(105%)"
      },
      {
        name: "Faded Film",
        value: "contrast(85%) brightness(110%) saturate(80%) sepia(15%)"
      },
      {
        name: "Rose Tint",
        value: "sepia(30%) hue-rotate(310deg) saturate(150%) brightness(105%)"
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {

      const storedPhotos =
        JSON.parse(localStorage.getItem("savedPhotos")) || [];

      const photoCount =
        parseInt(localStorage.getItem("photoCount")) || 4;

      const photos =
        storedPhotos.slice(0, photoCount);

      const photoStrip =
        document.getElementById("photoStrip");

      photoStrip.innerHTML = "";

      if (photos.length === 0) {

        const msg = document.createElement("p");

        msg.className = "empty-msg";

        msg.textContent =
          "No photos yet. Go back and add some.";

        photoStrip.replaceWith(msg);

      } else {

        photos.forEach((src, i) => {

          const img =
            document.createElement("img");

          img.src = src;

          img.alt =
            "Photo " + (i + 1);

          photoStrip.appendChild(img);
        });

        photoStrip.setAttribute(
          "data-count",
          photos.length
        );

        const textOutput =
          document.createElement("div");

        textOutput.id = "customText";

        textOutput.className = "custom-text";

        photoStrip.appendChild(textOutput);

        styleStrip(
          photoStrip,
          textOutput
        );

        const textInput =
          document.getElementById(
            "customTextInput"
          );

        textInput.addEventListener(
          "input",
          () => {
            textOutput.textContent =
              textInput.value.trim();
          }
        );

        const filterBox =
          document.getElementById(
            "filterOptions"
          );

        const savedFilter =
          localStorage.getItem(
            "photoFilter"
          ) || "none";

        function applyFilter(value) {

          localStorage.setItem(
            "photoFilter",
            value
          );

          photoStrip
            .querySelectorAll("img")
            .forEach((img) => {
              img.style.filter = value;
            });

          filterBox
            .querySelectorAll(".filter-button")
            .forEach((button) => {

              button.classList.toggle(
                "selected",
                button.dataset.value === value
              );

            });
        }

        FILTERS.forEach((filter) => {

          const button =
            document.createElement("button");

          button.type = "button";

          button.className =
            "filter-button";

          button.textContent =
            filter.name;

          button.dataset.value =
            filter.value;

          button.addEventListener(
            "click",
            () => applyFilter(filter.value)
          );

          filterBox.appendChild(button);
        });

        applyFilter(savedFilter);

        document
          .getElementById("previewButton")
          .addEventListener(
            "click",
            () => {

              localStorage.setItem(
                "photoText",
                textInput.value
              );

              localStorage.setItem(
                "photoCount",
                photos.length
              );

              window.location.href =
                "preview.html";
            }
          );
      }
    });
  </script>

</body>
</html>
