<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Frame</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Lora", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px 20px;
      background-color: #fefaf5;
      color: #5b4636;
    }

    header {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
    }

    header p {
      margin: 0;
    }

    .home-tag {
      text-decoration: none;
      color: #5a4637;
      font-size: 21px;
      font-weight: bold;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
    }

    h2 {
      margin: 0;
      font-size: 32px;
      color: #5b4636;
      text-align: center;
    }

    .frame-container {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    .frame {
      position: relative;
      width: 180px;
      aspect-ratio: 5 / 8;
      border: 1.5px solid #5b4636;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.3s, background 0.3s;
    }

    .frame:focus-visible {
      outline: 2px solid #866e5d;
      outline-offset: 3px;
    }

    .frame .placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #5b4636;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 12px;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    @media (hover: hover) {
      .frame:hover {
        border-color: transparent;
        background: #f6ede4;
      }

      .frame:hover .placeholder {
        opacity: 0;
      }

      .frame:hover img {
        opacity: 1;
      }
    }

    .frame.selected {
      border-color: #5b4636;
      background: #f0e6dd;
    }

    .frame.selected .placeholder {
      opacity: 0;
    }

    .frame.selected img {
      opacity: 1;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      padding: 10px 24px;
      border: 1.5px solid #5b4636;
      background: transparent;
      color: #5b4636;
      font-size: 16px;
      font-family: "Lora", serif;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.3s;
    }

    button:not(:disabled):hover {
      background: #5b4636;
      color: #f0e6dd;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #backBtn {
      border-color: #c3a792;
      color: #866e5d;
    }

    #backBtn:hover {
      background: #f0e6dd;
      border-color: #5b4636;
      color: #5b4636;
    }

    @media screen and (max-width: 600px) {
      body {
        justify-content: flex-start;
        padding: 0 12px 24px;
      }

      header {
        position: static;
        align-self: flex-start;
        padding: 16px 0 0;
      }

      .wrapper {
        flex: 1;
        justify-content: center;
        width: 100%;
        padding-top: 8px;
      }

      h2 {
        font-size: 24px;
      }

      .frame-container {
        gap: 10px;
        margin-top: 16px;
      }

      .frame {
        width: min(28vw, 110px);
        border-radius: 8px;
      }

      .frame img {
        padding: 6px;
      }

      .frame .placeholder {
        font-size: 13px;
      }

      .actions {
        margin-top: 28px;
      }

      button {
        padding: 12px 24px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <header>
    <p><a href="index.html" class="home-tag">photobooth</a></p>
  </header>

  <div class="wrapper">
    <h2>Select Your Frame</h2>

    <div class="frame-container">
      <div class="frame" data-id="2" role="button" tabindex="0" aria-pressed="false">
        <div class="placeholder">2 photos</div>
        <img src="Frame 2.png" alt="Frame for 2 photos" />
      </div>
      <div class="frame" data-id="3" role="button" tabindex="0" aria-pressed="false">
        <div class="placeholder">3 photos</div>
        <img src="Frame 3.png" alt="Frame for 3 photos" />
      </div>
      <div class="frame" data-id="4" role="button" tabindex="0" aria-pressed="false">
        <div class="placeholder">4 photos</div>
        <img src="Frame 4.png" alt="Frame for 4 photos" />
      </div>
    </div>

    <div class="actions">
      <button id="backBtn" type="button" onclick="window.location.href = 'index.html'">Back</button>
      <button id="doneBtn" type="button">Done</button>
    </div>
  </div>

  <script>
    let selectedFrame = null;
    const doneBtn = document.getElementById("doneBtn");
    const frames = document.querySelectorAll(".frame");
    doneBtn.disabled = true;

    function selectFrame(frame) {
      frames.forEach((f) => {
        f.classList.remove("selected");
        f.setAttribute("aria-pressed", "false");
      });
      frame.classList.add("selected");
      frame.setAttribute("aria-pressed", "true");

      selectedFrame = frame.getAttribute("data-id");
      localStorage.setItem("photoCount", selectedFrame);
      doneBtn.disabled = false;
    }

    frames.forEach((frame) => {
      frame.addEventListener("click", () => selectFrame(frame));
      frame.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectFrame(frame);
        }
      });
    });
      doneBtn.addEventListener("click", () => {
    if (!selectedFrame) {
      alert("Just so you know, you'll need to select the frame first");
      return;
    }
    window.location.href = "choosestyle.html";
  });
  </script>
</body>
</html>
